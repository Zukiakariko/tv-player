<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden; }
  #ytwrap, #video { position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: none; pointer-events: none; }
  #video { object-fit: contain; background: #000; }
  #player { width: 100%; height: 100%; pointer-events: none; }
</style>
</head>
<body>
<div id="ytwrap"><div id="player"></div></div>
<video id="video" playsinline preload="auto"></video>

<script src="https://www.youtube.com/iframe_api"></script>
<!-- Nur für .m3u8-Streams nötig. Version ist fest gepinnt. -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
  const video  = document.getElementById('video');
  const ytwrap = document.getElementById('ytwrap');

  let yt = null, ytReady = false, pendingYt = null;
  let hls = null, hlsRetries = 0;
  let videoLoaded = false, videoStart = 0;
  let kind = null;                       // 'yt' | 'video'
  let current = { key: null, seq: null, resource: null };
  let wantPaused = false;
  let volume = 0;
  let endedSent = false;

  const clampVol = (v) => Math.max(0, Math.min(100, Number(v) || 0));

  // ---- Debug-Anzeige (nur wenn Config.Debug = true) -------------------------
  let debugOn = false, dbgEl = null, dbgLines = [], stallTimer = null;

  function dbg(msg) {
    if (!debugOn) return;
    if (!dbgEl) {
      dbgEl = document.createElement('div');
      dbgEl.style.cssText = 'position:fixed;top:0;left:0;right:0;z-index:10;padding:8px;' +
        'font:22px/1.25 monospace;color:#0f0;background:rgba(0,0,0,.65);' +
        'white-space:pre-wrap;word-break:break-all;pointer-events:none;';
      document.body.appendChild(dbgEl);
    }
    dbgLines.push(msg);
    if (dbgLines.length > 9) dbgLines.shift();
    dbgEl.textContent = dbgLines.join('\n');
  }

  // Meldung an das Spiel (F8-Konsole), ohne das Video zu beenden
  function logToGame(msg) {
    dbg(msg);
    if (current.key === null || !current.resource) return;
    fetch(`https://cfx-nui-${current.resource}/log`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ msg })
    }).catch(() => {});
  }

  function show(which) {
    ytwrap.style.display = which === 'yt' ? 'block' : 'none';
    video.style.display  = which === 'video' ? 'block' : 'none';
  }

  // reason: Fehlergrund (wird im Spiel angezeigt), leer = Video normal zu Ende
  function reportEnded(reason) {
    if (endedSent || current.key === null || !current.resource) return;
    endedSent = true;
    if (reason) dbg('FEHLER: ' + reason);
    fetch(`https://cfx-nui-${current.resource}/ended`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ key: current.key, seq: current.seq, reason: reason || null })
    }).catch(() => {});
  }

  // ---- YouTube --------------------------------------------------------------
  function onYouTubeIframeAPIReady() {
    yt = new YT.Player('player', {
      width: '100%', height: '100%',
      playerVars: { autoplay: 1, controls: 0, disablekb: 1, modestbranding: 1, rel: 0, playsinline: 1 },
      events: {
        onReady: () => {
          ytReady = true;
          if (pendingYt) { const p = pendingYt; pendingYt = null; startYt(p.id, p.start); }
        },
        onStateChange: (e) => {
          if (kind !== 'yt') return;
          if (e.data === YT.PlayerState.ENDED) reportEnded();
          if (e.data === YT.PlayerState.PLAYING && wantPaused) yt.pauseVideo();
        },
        onError: (e) => { if (kind === 'yt') reportEnded('YouTube kann das Video nicht abspielen (Fehlercode ' + e.data + ').'); } // nicht abspielbar -> nächstes Video
      }
    });
  }

  function startYt(id, start) {
    yt.loadVideoById({ videoId: id, startSeconds: start || 0 });
    yt.setVolume(volume);
  }

  // ---- Normales Video / HLS ------------------------------------------------
  function tryPlay() {
    const p = video.play();
    if (p && p.catch) p.catch((err) => {
      logToGame('play() abgelehnt: ' + (err && err.name) + ' - ' + (err && err.message));
      // Autoplay mit Ton blockiert -> wenigstens stumm abspielen
      if (err && err.name === 'NotAllowedError') {
        video.muted = true;
        video.play().catch(() => {});
      }
    });
  }

  function startVideo(m, start) {
    videoStart = start || 0;
    videoLoaded = true;
    hlsRetries = 0;
    video.muted = false;
    video.volume = volume / 100;

    clearTimeout(stallTimer);
    stallTimer = setTimeout(() => {
      if (videoLoaded && video.readyState === 0) {
        logToGame('Nach 20 s noch keine Videodaten (networkState=' + video.networkState + '). ' +
          'Mögliche Ursachen: Server langsam, Datei nicht streaming-optimiert (moov-Block am Ende) ' +
          'oder Server ohne Range-Unterstützung.');
      }
    }, 20000);

    if (m.type === 'hls') {
      if (window.Hls && Hls.isSupported()) {
        hls = new Hls();
        hls.on(Hls.Events.ERROR, (_, data) => {
          if (!data.fatal) return;
          if (data.type === Hls.ErrorTypes.NETWORK_ERROR && hlsRetries < 2) { hlsRetries++; hls.startLoad(); }
          else if (data.type === Hls.ErrorTypes.MEDIA_ERROR && hlsRetries < 2) { hlsRetries++; hls.recoverMediaError(); }
          else reportEnded('HLS-Stream konnte nicht geladen werden (' + data.details + ').');
        });
        hls.loadSource(m.src);
        hls.attachMedia(video);
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = m.src;
      } else {
        reportEnded('HLS wird vom Player nicht unterstützt (hls.js nicht geladen).');
      }
    } else {
      video.src = m.src;
    }
  }

  ['loadstart', 'loadedmetadata', 'loadeddata', 'canplay', 'playing', 'waiting', 'stalled', 'suspend', 'abort', 'emptied'].forEach((ev) => {
    video.addEventListener(ev, () => {
      if (videoLoaded) dbg(ev + '  rs=' + video.readyState + ' ns=' + video.networkState +
        (isFinite(video.duration) ? ' dauer=' + Math.round(video.duration) + 's' : ''));
    });
  });

  video.addEventListener('loadedmetadata', () => {
    if (!videoLoaded) return;
    // Zeitsprung nur bei Videos mit fester Länge (Livestreams haben keine)
    if (videoStart > 0 && isFinite(video.duration)) {
      if (videoStart >= video.duration - 0.5) { reportEnded(); return; } // wäre längst vorbei
      video.currentTime = videoStart;
    }
    videoStart = 0;
    if (!wantPaused) tryPlay();
  });
  video.addEventListener('playing', () => { if (wantPaused) video.pause(); });
  video.addEventListener('ended',   () => { if (videoLoaded) reportEnded(); });
  video.addEventListener('error',   () => {                                   // bei HLS entscheidet hls.js
    if (!videoLoaded || hls) return;
    const code = video.error ? video.error.code : 0;
    const texts = {
      1: 'Wiedergabe abgebrochen.',
      2: 'Netzwerkfehler beim Laden (Server nicht erreichbar oder Zugriff verweigert).',
      3: 'Die Datei ist beschädigt oder der Codec wird nicht unterstützt.',
      4: 'Die Datei wurde nicht gefunden, der Zugriff ist blockiert oder das Format/der Codec wird nicht unterstützt (z. B. H.265).',
    };
    reportEnded((texts[code] || 'Unbekannter Fehler.') + ' [Code ' + code + ']');
  });

  // ---- Steuerung ------------------------------------------------------------
  function stopAll() {
    pendingYt = null;
    if (ytReady) { try { yt.stopVideo(); } catch (e) {} }
    videoLoaded = false;
    clearTimeout(stallTimer);
    if (hls) { hls.destroy(); hls = null; }
    video.pause();
    video.removeAttribute('src');
    video.load();
  }

  function play(d) {
    if (current.key === d.key && current.seq === d.seq) return; // Wiederholte Nachricht
    current = { key: d.key, seq: d.seq, resource: d.resource };
    endedSent = false;
    debugOn = !!d.debug;
    dbg('play empfangen: ' + ((d.media && d.media.type) || '?') + ' ' + ((d.media && d.media.src) || ''));
    wantPaused = !!d.paused;
    volume = clampVol(d.volume);
    stopAll();

    const m = d.media || {};
    if (m.type === 'youtube') {
      kind = 'yt';
      show('yt');
      if (ytReady) startYt(m.src, d.start); else pendingYt = { id: m.src, start: d.start };
    } else if ((m.type === 'video' || m.type === 'hls') && location.protocol === 'https:' && /^http:\/\//i.test(m.src || '')) {
      kind = 'video';
      reportEnded('Die Videoadresse beginnt mit http://, der Player läuft aber über https. Der Browser blockiert das (Mixed Content). Das Video muss über https:// erreichbar sein.');
    } else if ((m.type === 'video' || m.type === 'hls') && /^https?:\/\//i.test(m.src || '')) {
      kind = 'video';
      show('video');
      startVideo(m, d.start);
    } else {
      reportEnded('Ungültige Videoquelle.');
    }
  }

  function seek(t) {
    if (kind === 'yt' && ytReady) {
      yt.seekTo(t, true);
    } else if (kind === 'video' && videoLoaded && video.readyState > 0 && isFinite(video.duration)) {
      video.currentTime = Math.min(t, video.duration);
    }
  }

  function handle(d) {
    switch (d.action) {
      case 'play':
        play(d);
        break;
      case 'state':
        wantPaused = !!d.paused;
        seek(d.time || 0);
        if (kind === 'yt' && ytReady) {
          if (wantPaused) yt.pauseVideo(); else yt.playVideo();
        } else if (kind === 'video' && videoLoaded) {
          if (wantPaused) video.pause(); else tryPlay();
        }
        break;
      case 'volume':
        volume = clampVol(d.volume);
        if (kind === 'yt' && ytReady) yt.setVolume(volume);
        else if (kind === 'video') video.volume = volume / 100;
        break;
    }
  }

  window.addEventListener('message', (e) => {
    if (e.data && typeof e.data === 'object') handle(e.data);
  });
</script>
</body>
</html>
